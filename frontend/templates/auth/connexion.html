{% extends "base.html" %}
{% block titre %}Connexion — T.R.A.I.L{% endblock %}
{% block contenu %}
<div class="form-card">
    <h1 class="text-center">Connexion</h1>
    <p class="text-small text-soft text-center mb-1">Accédez à votre compte T.R.A.I.L</p>
    
    <form method="post" class="mt-2">
        <div class="form-group">
            <label for="email">Adresse Email</label>
            <input type="email" id="email" name="email" class="form-control" required autofocus placeholder="nom@exemple.com">
        </div>
        <div class="form-group">
            <label for="mdp">Mot de passe</label>
            <input type="password" id="mdp" name="mdp" class="form-control" required placeholder="••••••••">
        </div>
        <div class="form-group">
            <label class="form-check">
                <input type="checkbox" id="souvenir" name="souvenir">
                <span>Se souvenir de moi</span>
            </label>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Se connecter</button>
    </form>
    
    <p class="text-small text-center mt-2">
        Pas encore de compte ? <a href="{{ url_for('auth.inscription') }}" class="text-bold" style="color: var(--primary);">S'inscrire</a>
    </p>
</div>
{% endblock %}
